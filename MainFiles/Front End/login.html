<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MealMate Login</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main>
        <h1>MealMate</h1>

        <section id="login-section">
            <h2>Login</h2>

            <form id="login-form">
                <input
                    type="text"
                    id="login-username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>
            </form>

            <p>Don't have an account?</p>
            <button type="button" id="show-register">Register</button>
        </section>

        <section id="register-section" hidden>
            <h2>Create Account</h2>

            <form id="signup-form">
                <input
                    type="text"
                    id="signup-username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="signup-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Create Account</button>
            </form>

            <p>Already have an account?</p>
            <button type="button" id="show-login">Back to Login</button>
        </section>

        <p id="message"></p>
    </main>
    <script type="module" src="../Back%20End/login.js"></script>
</body>
</html>
