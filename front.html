<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Screen</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
            background-color: #333;
        }

        .search-bar {
            padding: 10px 15px;
            width: 220px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        main {
            padding: 30px;
        }
    </style>
</head>
<body>

    <header>
        <input
            type="text"
            class="search-bar"
            placeholder="Search..."
            aria-label="Search"
        >
    </header>

    <main>
        <h1>Welcome</h1>
        <p>MealMate</p>
    </main>

</body>
</html>
